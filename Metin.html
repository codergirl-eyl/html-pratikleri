<!DOCTYPE html>
<html>
    <head>
        <title>Metin Biçimlendirme</title>
    </head>
    <body>
        <p>Bu normal bir yazıdır.</p>
        <p>Bu <b>kalın</b> bir yazıdır.</p>
        <p>Bu <i>italic</i> bir yazıdır.</p>
        <p>Bu <big> büyük</big> bir yazıdır.</p>
        <p>Bu <small>küçük</small> bir yazıdır.</p>
        <p>Bu <sub>alt simge</sub> bir yazıdır.</p>
        <p>Bu <sup>üst simge</sup> bir yazıdır.</p>
        <p>Bu <ins>altı çizili</ins> bir yazıdır.</p>
        <p>Bu <del>silinmiş</del> bir yazıdır.</p>
        <p>Bu <mark>vurgulanmış</mark> bir yazıdır.</p>
    </body>
</html>
